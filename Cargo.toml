[package]
name = "sbrowser"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scraper = "0.22"
url = "2.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager", "aio"] }

